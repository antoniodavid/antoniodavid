name: Feature request
description: Propose a user-facing feature or improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or opportunity does this request address?
      placeholder: Describe the current state and its impact.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the outcome you want to see.
      placeholder: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion.
      placeholder: How can we verify the request is complete?
    validations:
      required: true
